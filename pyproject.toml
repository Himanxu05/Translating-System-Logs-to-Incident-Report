[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logreport"
version = "2.0.0"
description = "Turn raw system logs into structured incident reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# training / local models
train = ["torch>=2.2", "transformers>=4.45", "peft>=0.13", "datasets>=2.20", "accelerate>=0.34"]
# prompted big-model baseline
llm = ["langchain-groq>=0.2", "langchain-core>=0.3", "python-dotenv>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/logreport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["v1", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S"]
ignore = ["S101", "S311", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/logreport/labels.py" = ["E501"]
"scripts/*" = ["E402"]
# downloads only from the fixed https Loghub URL
"src/logreport/loghub.py" = ["S310"]
